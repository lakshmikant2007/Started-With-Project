<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form</title>
    <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Times New Roman',sans-serif;
    }

    body{
      background:linear-gradient(135deg,#4facfe,#00f2fe);
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .container{
      background:#fff;
      width:100%;
      max-width:500px;
      padding:30px;
      border-radius:15px;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
    }

    .container h2{
      text-align:center;
      margin-bottom:20px;
      color:#333;
    }

    .input-box{
      margin-bottom:15px;
    }

    .input-box label{
      display:block;
      margin-bottom:5px;
      font-weight:bold;
      color:#444;
    }

    .input-box input,
    .input-box select,
    .input-box textarea{
      width:100%;
      padding:10px;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
      transition:0.3s;
    }

    .input-box input:focus,
    .input-box select:focus,
    .input-box textarea:focus{
      border-color:#4facfe;
      box-shadow:0 0 5px rgba(79,172,254,0.5);
    }

    .gender-box{
      display:flex;
      gap:20px;
      margin-top:5px;
    }

    .submit-btn{
      width:100%;
      padding:12px;
      border:none;
      background:#6d6f71;
      color:white;
      font-size:18px;
      border-radius:8px;
      cursor:pointer;
      transition:0.3s;
    }

    .submit-btn:hover{
      background:#00ff51;
    }

    .success{
      text-align:center;
      color:green;
      margin-top:15px;
      font-weight:bold;
    }
  </style>
</head>
<body>
 <div class="container">
    <h2>Application Form</h2>

    <form id="applicationForm">


      <div class="input-box">
        <label>Full Name</label>
        <input type="text" id="name" required>
      </div>

      <div class="input-box">
        <label>Father's Name</label>
        <input type="text" id="father" required>
      </div>

      <div class="input-box">
        <label>Mother's Name</label>
        <input type="text" id="mother" required>
      </div>

      <div class="input-box">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>

      <div class="input-box">
        <label>Phone Number</label>
        <input type="tel" id="phone" required>
       </div>

      <div class="input-box">
    <label>Course</label>

    <select id="course" required>
        <option value="">Select Course</option>
        <option value="bca">BCA</option>
        <option value="btech">B.Tech</option>
        <option value="mca">MCA</option>
        <option value="mba">MBA</option>
    </select>
</div>

      <div class="input-box">
        <label>College Name</label>
        <input type="text" id="college" required>
      </div>

      <div class="input-box">
        <label>Gender</label>

        <div class="gender-box">
          <label><input type="radio" name="gender" required> Male</label>
          <label><input type="radio" name="gender"> Female</label>
          <label><input type="radio" name="gender"> Other</label>
        </div>
      </div>

      <div class="input-box">
        <label>Address</label>
        <textarea rows="4" id="address" required></textarea>
      </div>

      <div class="input-box">
        <label>Upload Your Photo</label>
        <input type="file" id="photo" accept="image/*" required>
      </div>

      <button type="submit" class="submit-btn">
        Submit
      </button>
      <div class="success" id="successMsg"></div>

    </form>
  </div>
   <script>
      const form = document.getElementById("applicationForm");
      const successMsg = document.getElementById("successMsg");

      form.addEventListener("submit", function(e){
      e.preventDefault();

      successMsg.innerHTML = "Form Submitted Successfully !!";

      form.reset();
      });
    </script>
</body>
</html>
